name: Build Kinetik AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Official Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate Android Code
        run: |
          mkdir -p app/src/main/java/com/kinetik/ai
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KinetikAI"
          include ':app'
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.kinetik.ai'
              compileSdk 34

              defaultConfig {
                  applicationId "com.kinetik.ai"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Kinetik AI"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OverlayService"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bubble_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <gradient
                  android:startColor="#FFA500"
                  android:endColor="#FF4500"
                  android:type="linear"
                  android:angle="45" />
              <stroke
                  android:width="3dp"
                  android:color="#FFFFFF" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:background="#121212"
              android:padding="24dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="KINETIK AI"
                  android:textColor="#FF8C00"
                  android:textSize="32sp"
                  android:textStyle="bold" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:text="Mobil Video Edit Asistanı"
                  android:textColor="#AAAAAA"
                  android:textSize="16sp" />

              <Button
                  android:id="@+id/btnStartOverlay"
                  android:layout_width="match_parent"
                  android:layout_height="60dp"
                  android:layout_marginTop="48dp"
                  android:backgroundTint="#FF8C00"
                  android:text="Baloncuğu Başlat (Start)"
                  android:textColor="#FFFFFF"
                  android:textSize="18sp" />
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/kinetik/ai/MainActivity.java
          package com.kinetik.ai;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.View;
          import android.widget.Button;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  Button btnStart = findViewById(R.id.btnStartOverlay);
                  btnStart.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(MainActivity.this)) {
                              Toast.makeText(MainActivity.this, "Lütfen 'Diğer uygulamaların üzerinde göster' iznini açın", Toast.LENGTH_LONG).show();
                              Intent intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                      Uri.parse("package:" + getPackageName()));
                              startActivityForResult(intent, 123);
                          } else {
                              startOverlay();
                          }
                      }
                  });
              }

              private void startOverlay() {
                  startService(new Intent(this, OverlayService.class));
                  finish();
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/kinetik/ai/OverlayService.java
          package com.kinetik.ai;

          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.os.Build;
          import android.os.IBinder;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.core.content.ContextCompat;

          public class OverlayService extends Service {
              private WindowManager windowManager;
              private TextView floatingView;

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public void onCreate() {
                  super.onCreate();

                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);

                  floatingView = new TextView(this);
                  floatingView.setText("K");
                  floatingView.setTextSize(28);
                  floatingView.setTextColor(Color.WHITE);
                  floatingView.setGravity(Gravity.CENTER);
                  floatingView.setBackground(ContextCompat.getDrawable(this, R.drawable.bubble_bg));

                  int layoutType;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      layoutType = WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY;
                  } else {
                      layoutType = WindowManager.LayoutParams.TYPE_PHONE;
                  }

                  final WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                          170, 170,
                          layoutType,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                  );

                  params.gravity = Gravity.TOP | Gravity.START;
                  params.x = 100;
                  params.y = 300;

                  floatingView.setOnTouchListener(new View.OnTouchListener() {
                      private int initialX;
                      private int initialY;
                      private float initialTouchX;
                      private float initialTouchY;

                      @Override
                      public boolean onTouch(View v, MotionEvent event) {
                          switch (event.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  initialX = params.x;
                                  initialY = params.y;
                                  initialTouchX = event.getRawX();
                                  initialTouchY = event.getRawY();
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  params.x = initialX + (int) (event.getRawX() - initialTouchX);
                                  params.y = initialY + (int) (event.getRawY() - initialTouchY);
                                  windowManager.updateViewLayout(floatingView, params);
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  float diffX = Math.abs(event.getRawX() - initialTouchX);
                                  float diffY = Math.abs(event.getRawY() - initialTouchY);
                                  if (diffX < 15 && diffY < 15) {
                                      Toast.makeText(OverlayService.this, "Kinetik AI: Hazırım! CapCut'ı açabilirsin 🔥", Toast.LENGTH_SHORT).show();
                                  }
                                  return true;
                          }
                          return false;
                      }
                  });

                  windowManager.addView(floatingView, params);
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (floatingView != null) {
                      windowManager.removeView(floatingView);
                  }
              }
          }
          EOF

      - name: Build APK with Clean Gradle 8.2
        run: gradle assembleDebug --no-daemon

      - name: Upload Kinetik AI APK
        uses: actions/upload-artifact@v4
        with:
          name: KinetikAI-Poco-Build
          path: app/build/outputs/apk/debug/app-debug.apk